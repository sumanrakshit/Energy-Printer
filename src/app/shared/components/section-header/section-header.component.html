<div class="row align-items-center mb-4">
  <div class="col-md">
    <h2 class="fw-bold mb-1 text-dark fs-2">{{ title }}</h2>
    <p class="text-muted mb-0 subtitle-text fs-6">{{ subtitle }}</p>
  </div>
  <div class="col-md-auto mt-3 mt-md-0" *ngIf="buttonText && buttonLink">
    <a [routerLink]="buttonLink" class="btn btn-outline-primary-custom px-4 d-inline-flex align-items-center gap-2">
      {{ buttonText }} <i class="bi bi-arrow-right"></i>
    </a>
  </div>
</div>
