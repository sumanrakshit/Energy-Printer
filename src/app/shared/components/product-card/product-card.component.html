<div class="card card-custom h-100 product-card-inner cursor-pointer" (click)="openPdf()">
  <div class="card-img-container d-flex align-items-center justify-content-center p-3 bg-light-gray-custom">
    <!-- Product Image -->
    <img [src]="product.image" [alt]="product.name" class="product-image">
  </div>

  <div class="card-body d-flex flex-column p-4">
    <!-- Title -->
    <h5 class="card-title fw-bold text-dark mb-2">{{ product.name }}</h5>
    
    <!-- Description -->
    <p class="card-text text-muted fs-7 mb-0 flex-grow-1">{{ product.description }}</p>
  </div>
</div>
