<section class="latest-models-section py-5 bg-white">
  <div class="container py-4">
    <!-- Header -->
    <app-section-header
      title="Latest Models"
      subtitle="Discover the newest printer technology"
      buttonText="View All Latest"
      buttonLink="/all-printers"
    ></app-section-header>

    <!-- Product Grid -->
    <div class="row g-4">
      <div class="col-lg-4 col-md-6" *ngFor="let printer of latestPrinters">
        <app-product-card [product]="printer"></app-product-card>
      </div>
    </div>
  </div>
</section>
